    <g transform="translate(600 160) scale(.85)"><circle r="10" cx="0" cy="-12"/><circle r="10" cx="11" cy="-4"/><circle r="10" cx="7" cy="10"/><circle r="10" cx="-7" cy="10"/><circle r="10" cx="-11" cy="-4"/><circle r="6" fill="#EFCB8F"/></g>
    <g transform="translate(335 350) scale(.9)"><circle r="10" cx="0" cy="-12"/><circle r="10" cx="11" cy="-4"/><circle r="10" cx="7" cy="10"/><circle r="10" cx="-7" cy="10"/><circle r="10" cx="-11" cy="-4"/><circle r="6" fill="#EFCB8F"/></g>
    <g transform="translate(210 160) scale(.75)"><circle r="10" cx="0" cy="-12"/><circle r="10" cx="11" cy="-4"/><circle r="10" cx="7" cy="10"/><circle r="10" cx="-7" cy="10"/><circle r="10" cx="-11" cy="-4"/><circle r="6" fill="#EFCB8F"/></g>
